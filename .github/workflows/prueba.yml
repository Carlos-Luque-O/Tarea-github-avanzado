name: Prueba Runner y Secrets

on: [push]

jobs:
  comparar-tokens:
    runs-on: self-hosted

    steps:
      - name: Comparar DEV_TOKEN con LOCAL_DEV_TOKEN
        shell: powershell

        env:
          SECRET_DEV: ${{ secrets.DEV_TOKEN }}

        run: |
          $localToken = [System.Environment]::GetEnvironmentVariable('LOCAL_DEV_TOKEN', 'Machine')

          Write-Host "Comprobando valores..."

          if ($env:SECRET_DEV -eq $localToken) {
            Write-Host "COINCIDEN: Los valores son identicos."
            exit 0
          } else {
            Write-Error "ERROR: Los valores no coinciden."
            exit 1
          }
