on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}
 
permissions:
  contents: write
 
jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - name: Incrementar versión en el README
        run: |
          LAST=$(grep -oP 'AppVersion-\K[0-9]+' README.md | tail -1)
          NEXT=$((LAST + 1))
          FECHA=$(TZ=Europe/Madrid date '+%d/%m/%Y %H:%M')
          echo "- AppVersion-$NEXT - $FECHA" >> README.md
 
      - name: Commit y push del README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: bump de versión" || echo "Sin cambios que commitear"
          git push || echo "Nada que subir"
 
  validate-prod:
    needs: bump-version
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Validar entorno de producción
        env:
          SECRET_PROD_TOKEN: ${{ secrets.PROD_TOKEN }}
        run: |
          if ($env:SECRET_PROD_TOKEN -ne $env:LOCAL_PROD_TOKEN) {
            Write-Error "Error: El token de producción no coincide"
            exit 1
          }
          Write-Host "Token de producción validado correctamente"
